[package]
name = "rswift"
description = "Build native Apple apps from Rust — unified re-export of all rswift framework crates"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["apple", "swift", "macos", "ios", "framework"]
categories = ["api-bindings", "os::macos-apis"]

[lib]
name = "rswift"

# ─────────────────────────────────────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────────────────────────────────────
#
# Pick only the frameworks you need:
#
#   rswift = { version = "0.0.1", features = ["avfaudio", "metal", "swiftui"] }
#
# Or pull in a category:
#
#   rswift = { version = "0.0.1", features = ["media"] }
#
# Or everything:
#
#   rswift = { version = "0.0.1", features = ["full"] }
#

[features]
default = []

# ── Category bundles ─────────────────────────────────────────────────────────

## Everything.
full = [
    "runtime", "ui", "media", "ml", "graphics", "data", "auth",
    "network", "location", "health", "commerce", "games",
    "hardware", "system", "comms", "ar-vr",
]

## Core Swift runtime, Foundation, and helpers.
runtime = ["swift-runtime", "swift-runtime-sys", "apple-sys-helpers", "foundation", "security", "appkit"]

## UI frameworks.
ui = ["swiftui", "swiftui-app", "charts", "tipkit", "widgetkit"]

## Media & AV.
media = [
    "avfaudio", "avfoundation", "avkit", "mediaplayer", "musickit",
    "cinematic", "shazamkit", "soundanalysis", "speech",
    "screencapturekit", "replaykit", "photosui", "coremedia", "audiotoolbox",
]

## Machine learning & AI, plus hardware-accelerated math.
ml = [
    "coreml", "createml", "vision", "naturallanguage",
    "foundation-models", "translation", "accelerate",
]

## Graphics & rendering.
graphics = [
    "metal", "scenekit", "spritekit", "coregraphics", "coreimage",
    "coretext", "coreanimation",
]

## Data & persistence.
data = ["swift-data", "swiftdata", "coredata", "cloudkit", "combine"]

## Authentication & security.
auth = [
    "authenticationservices", "cryptokit", "cryptotokenkit",
    "localauthentication", "devicecheck",
]

## Networking.
network = [
    "network-framework", "networkextension", "multipeerconnectivity",
    "linkpresentation", "webkit",
]

## Location & maps.
location = ["corelocation", "mapkit"]

## Health & fitness.
health = ["healthkit", "workoutkit"]

## Commerce & payments.
commerce = ["storekit", "passkit", "financekit"]

## Games.
games = [
    "gamekit", "gamecontroller", "gameplaykit", "gamesave",
]

## Hardware & sensors.
hardware = [
    "corebluetooth", "corehaptics", "corehid", "coremotion", "corenfc",
    "nearbyinteraction", "dockkit", "sensorkit",
]

## System services.
system = [
    "oslog", "backgroundtasks", "extensionkit", "uniformtypeidentifiers",
    "usernotifications", "pushkit", "eventkit",
]

## Communication.
comms = [
    "callkit", "messageui", "contacts", "livecommunicationkit",
    "groupactivities",
]

## AR / VR / Spatial.
ar-vr = [
    "arkit", "realitykit", "realityfoundation", "spatial",
    "roomplan", "compositorservices",
]

# ── Individual framework features ────────────────────────────────────────────

# Core
swift-runtime       = ["dep:swift-runtime"]
swift-runtime-sys   = ["dep:swift-runtime-sys"]
apple-sys-helpers   = ["dep:apple-sys-helpers"]
