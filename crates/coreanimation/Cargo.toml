[package]
name = "rswift-coreanimation"
description = "Apple CoreAnimation — animation timing and transactions from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["coreanimation", "animation", "calayer", "apple"]

[lib]
name = "coreanimation"

[dependencies]
apple-sys-helpers = { workspace = true }

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build" }

[[example]]
name = "check"
path = "examples/check.rs"

[lints]
workspace = true
