[package]
name = "storekit"
description = "Apple StoreKit — in-app purchases and subscriptions from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"

[lib]
name = "storekit"

[dependencies]
apple-objc-sys = { path = "../apple-objc-sys" }

[features]
default = []
## Enable StoreKit 2 async product fetching (requires Swift toolchain).
storekit2 = ["dep:swift-helper-build"]

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build", optional = true }

[[example]]
name = "check"
path = "examples/check.rs"

[lints]
workspace = true
