[package]
name = "storekit"
description = "Apple StoreKit — in-app purchases and subscriptions from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"

[lib]
name = "storekit"

[dependencies]
apple-sys-helpers = { workspace = true }

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build" }

[[example]]
name = "check"
path = "examples/check.rs"

[lints]
workspace = true
