[package]
name = "videosubscriberaccount"
description = "Apple VideoSubscriberAccount — TV provider authentication from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["videosubscriberaccount", "tv-provider", "sso", "apple"]

[lib]
name = "videosubscriberaccount"

[dependencies]
apple-objc-sys = { path = "../apple-objc-sys" }

[build-dependencies]
# no build deps needed

[[example]]
name = "check"
path = "examples/check.rs"

[lints]
workspace = true
