[package]
name = "rswift-security"
description = "Apple Security — Keychain access and secure random from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["security", "keychain", "apple", "macos", "ios"]

[lib]
name = "security"

[dependencies]
apple-sys-helpers = { workspace = true }

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build" }

[[example]]
name = "keychain"
path = "examples/keychain.rs"

[lints]
workspace = true
