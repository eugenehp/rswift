[package]
name = "swift-runtime-sys"
description = "Raw FFI bindings to the Swift Runtime"
version = "0.0.5"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["swift", "runtime", "sys", "bindings", "ffi"]
readme = "../../README.md"
exclude = ["swift"]

[lints]
workspace = true

[lib]
name = "swift_runtime_sys"

[features]
default = []
## Enable to regenerate FFI bindings from Swift headers (requires libclang).
## Set `SWIFT_RUNTIME_SYS_GENERATE_BINDINGS=1` at build time.
generate-bindings = ["dep:bindgen"]
## Enable RuntimeContract / ConcurrencyAbi modules (pulls in serde + serde_json).
runtime-contract = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
libc = "0.2"

[build-dependencies]
bindgen = { package = "bindgen", git = "https://github.com/eugenehp/rust-bindgen.git", branch = "swift", version = "0.69.4", optional = true }

[[example]]
name = "runtime_enum_probe"
required-features = ["runtime-contract"]
