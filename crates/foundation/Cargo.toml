[package]
name = "rswift-foundation"
description = "Apple Foundation — UserDefaults, FileManager, ProcessInfo, Bundle, Locale from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["foundation", "apple", "userdefaults", "filemanager", "macos"]

[lib]
name = "foundation"

[dependencies]
apple-sys-helpers = { workspace = true }

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build" }

[[example]]
name = "check"
path = "examples/check.rs"

[[example]]
name = "userdefaults"
path = "examples/userdefaults.rs"

[[example]]
name = "sysinfo"
path = "examples/sysinfo.rs"

[lints]
workspace = true
