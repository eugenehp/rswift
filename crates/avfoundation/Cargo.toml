[package]
name = "rswift-avfoundation"
description = "Apple AVFoundation — media capture, playback, and editing from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["avfoundation", "video", "audio", "playback", "apple"]

[lib]
name = "avfoundation"

[dependencies]
apple-objc-sys = { path = "../apple-objc-sys" }

[build-dependencies]
# no build deps needed

[[example]]
name = "check"
path = "examples/check.rs"

[[example]]
name = "player"
path = "examples/player.rs"

[[example]]
name = "asset_info"
path = "examples/asset_info.rs"

[lints]
workspace = true
