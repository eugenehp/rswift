[package]
name = "avfaudio"
description = "Apple AVFAudio — audio playback, recording, and processing from Rust"
version = "0.0.6"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["audio", "avfaudio", "playback", "recording", "apple"]

[lib]
name = "avfaudio"

[dependencies]
apple-objc-sys = { path = "../apple-objc-sys" }
bitflags = "2"
anyhow = "1"

[build-dependencies]
# no build deps needed

[[example]]
name = "check"
path = "examples/check.rs"

[[example]]
name = "play_audio"
path = "examples/play_audio.rs"

[lints]
workspace = true
