[package]
name = "avfaudio"
description = "Apple AVFAudio — audio playback, recording, and processing from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["audio", "avfaudio", "playback", "recording", "apple"]

[lib]
name = "avfaudio"

[dependencies]
apple-sys-helpers = { workspace = true }

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build" }

[[example]]
name = "check"
path = "examples/check.rs"

[[example]]
name = "play_audio"
path = "examples/play_audio.rs"

[lints]
workspace = true
