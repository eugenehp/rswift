[package]
name = "swiftui-macros"
version = "0.0.1"
edition = "2021"
description = "Procedural macros for the swiftui crate"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"

[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"

[lints]
workspace = true
