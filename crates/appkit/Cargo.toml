[package]
name = "rswift-appkit"
description = "Apple AppKit/UIKit — app lifecycle, clipboard, screen info, alerts from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["appkit", "uikit", "macos", "ios", "apple"]

[lib]
name = "appkit"

[dependencies]
apple-sys-helpers = { workspace = true }

[build-dependencies]
swift-helper-build = { path = "../swift-helper-build" }

[[example]]
name = "check"
path = "examples/check.rs"

[lints]
workspace = true
