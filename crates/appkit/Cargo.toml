[package]
name = "rswift-appkit"
description = "Apple AppKit/UIKit — app lifecycle, clipboard, screen info, alerts from Rust"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/eugenehp/rswift"
keywords = ["appkit", "uikit", "macos", "ios", "apple"]

[lib]
name = "appkit"

[dependencies]
apple-objc-sys = { path = "../apple-objc-sys" }

[build-dependencies]
# no build deps needed

[[example]]
name = "check"
path = "examples/check.rs"

[lints]
workspace = true
